name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. sha-<full>); leave empty for this commit"
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: Build, vet and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify dependencies are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  integration:
    name: Integration and concurrency tests
    # Pinned to 22.04 rather than ubuntu-latest. mongod 8.x crashes at startup
    # on Linux kernels 6.19 through 7.0.13 ("MongoDB cannot start: Linux kernel
    # versions 6.19 and newer has a known incompatibility", SERVER-121912), and
    # both ubuntu-latest and ubuntu-24.04 runners now carry such a kernel.
    # MongoDB's release notes name kernel 7.0.14+ as the fix; move back to
    # ubuntu-latest once the runners have it.
    runs-on: ubuntu-22.04

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The suite exercises multi-document transactions, which need a replica
      # set; a standalone mongod would skip the half of it that matters. A
      # single-node set is enough and starts in seconds.
      #
      # The image is pinned by digest (the one the last green run, 2026-10-25,
      # pulled) so a moving tag cannot change this job unannounced. Bump it
      # deliberately.
      - name: Start MongoDB as a single-node replica set
        run: |
          uname -r
          docker run -d --name mongo -p 27017:27017 \
            mongo:8@sha256:0e900a3364da37b76d642b73b0bba56bd4c6c509ab470cf700436fd866bee3ff \
            --replSet rs0 --bind_ip_all

          for _ in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'

          # Wait for the node to finish electing itself, or the first
          # transaction fails with "not primary".
          for _ in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              break
            fi
            sleep 1
          done

      # A container that exits at startup says why only in its own log.
      - name: MongoDB container log
        if: failure()
        run: docker logs mongo || true

      - name: Integration tests
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/?replicaSet=rs0
          MONGODB_TEST_DATABASE: denisco_integration_test
          REDIS_URL: redis://localhost:6379/0
        run: go test -race -count=1 -timeout 20m ./tests/...

  deployment:
    name: Validate the deployment configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate the Compose file
        working-directory: deployments
        run: |
          cp .env.example .env
          # The API's environment file lives outside the repository on the
          # VPS, so point the check at a stub rather than loosening the
          # production configuration to tolerate a missing one.
          cp ../.env.example ci-api.env
          # The frontend build contexts are sibling repositories, which this
          # checkout does not include.
          mkdir -p ../../denisco_web ../../denisco_admin
          ENV_FILE="$PWD/ci-api.env" docker compose --env-file .env config >/dev/null
          ENV_FILE="$PWD/ci-api.env" docker compose --env-file .env \
            -f compose.yaml -f compose.local.yaml config >/dev/null

      - name: Validate the Caddyfile
        working-directory: deployments
        run: |
          docker run --rm \
            --env WEB_DOMAIN=example.com \
            --env WWW_DOMAIN=www.example.com \
            --env ADMIN_DOMAIN=admin.example.com \
            --env API_DOMAIN=api.example.com \
            --env ACME_EMAIL=ops@example.com \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Check the backup scripts
        working-directory: deployments
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck backup.sh restore.sh deploy.sh
          bash -n backup.sh restore.sh deploy.sh

  publish:
    name: Build and push GHCR images
    needs: [verify, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: denisco-api
            dockerfile: deployments/Dockerfile.api
          - image: denisco-worker
            dockerfile: deployments/Dockerfile.worker
          - image: denisco-outbox
            dockerfile: deployments/Dockerfile.outbox-publisher

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/dev-folabi/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to the VPS
    needs: [verify, integration, publish]
    # Runs for a push to main and for a manual dispatch (which takes an
    # optional image tag, for rolling back to a previous release). The VPS
    # itself must already be provisioned; DEPLOY_ENABLED is the switch.
    if: |
      always() &&
      needs.verify.result == 'success' &&
      needs.integration.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-denisco-backend
      cancel-in-progress: false

    steps:
      - name: Deploy api, worker and outbox
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          TAG: ${{ github.event.inputs.tag || format('sha-{0}', github.sha) }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "VPS_SSH_KEY secret and VPS_HOST variable are required" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=accept-new "deploy@$VPS_HOST" \
            "cd /opt/denisco/denisco_backend/deployments && ./deploy.sh api,worker,outbox '$TAG'"
