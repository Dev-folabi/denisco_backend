# Redis configuration for the VPS.
#
# Redis holds the Asynq queues. A lost queue means lost emails and a missed
# reservation sweep, so persistence is on; it is not used as a cache that may
# be thrown away.

# Reachable only on the internal compose network; no port is published.
bind 0.0.0.0
protected-mode no

# Append-only file: every write is recorded, and fsync once a second bounds
# what a hard crash can lose to about one second of queue activity.
appendonly yes
appendfsync everysec
dir /data

# RDB snapshots as well, as a cheap second line of recovery and because they
# are what the backup script copies.
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# Bounded so Redis can never squeeze the application processes on a 2 GB box.
# noeviction is deliberate: silently dropping a queued job would be worse than
# refusing the write, which the outbox publisher retries.
maxmemory 96mb
maxmemory-policy noeviction

# Rewrite the append-only file once it has doubled, so it does not grow without
# limit on a small disk.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb

# Queue work is bursty but short; a client that has gone away should not hold a
# connection forever.
timeout 300
tcp-keepalive 300

loglevel notice
